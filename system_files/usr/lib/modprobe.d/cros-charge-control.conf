# Allow cros_charge_control to bind on Framework laptops.
# By default the driver detects the FRMWC ACPI ID and refuses to load.
# Setting probe_with_fwk_charge_control=1 overrides that and exposes
# charge_control_end_threshold / charge_control_start_threshold in sysfs,
# which lets upower and GNOME's Battery Limit toggle work correctly.
options cros_charge_control probe_with_fwk_charge_control=1